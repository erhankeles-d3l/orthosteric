[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthosteric"
version = "0.1.0"
description = "Comparative evidence learning for mechanistic orthosteric selectivity, benchmarked on Class I PI3Ks"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
    "rdkit>=2024.3",  # SCI0-008b; RDKit version affects InChIKey (SCI0-011)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orthosteric"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","A","C4","DTZ","PT","RET","SIM","ARG","PL","RUF","D","ANN","S"]
ignore = ["D203","D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D103", "D205", "D209", "PLR0913", "PLR0917"]
"src/orthosteric/data/harmonization/*.py" = [
    "S110",  # try/except/pass in RDKit metal disconnection
    "N812",  # rdkit version import alias
]
"src/orthosteric/data/sources/**/*.py" = [
    "S310", "S607", "BLE001", "ARG002",
]
"src/orthosteric/data/sources/*.py" = [
    "ARG002",  # **kwargs kept for interface contract
    "S112",    # try/except/continue in network retry loops
    "BLE001",  # broad exception in network loops
]
"src/orthosteric/data/*.py" = [
    "D101", "D102", "D103", "D104", "D107",
    "ARG001",
    "PLR2004", "PLR0912",
    "S310", "S607",
    "RUF001", "RUF002", "RUF003",
    "D205",
    "ANN401",
    "N818",  # GovernanceException name is a deliberate design choice
]
"scripts/refresh_corpus.py" = ["D103", "S607"]
"tests/data/sources/*.py" = ["PLC0415"]  # monkeypatch requires local import


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/orthosteric"]
branch = true

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = "tests.data.sources.structural.*"
disable_error_code = ["comparison-overlap", "unused-ignore"]

[[tool.mypy.overrides]]
module = "orthosteric.data.harmonization._scaffold"
disable_error_code = ["unreachable"]
