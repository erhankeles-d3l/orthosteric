[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthosteric"
version = "0.1.0"
description = "Comparative evidence learning for mechanistic orthosteric selectivity, benchmarked on Class I PI3Ks"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
    "rdkit>=2024.3",  # SCI0-008b; RDKit version affects InChIKey (SCI0-011)
    "biopython>=1.84",  # SCI1-002; structural preprocessing (pocket geometry, rotamer, SASA)
    "scikit-learn>=1.5",   # SCI1-020; proteochemometric baseline (PCM)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orthosteric"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","A","C4","DTZ","PT","RET","SIM","ARG","PL","RUF","D","ANN","S"]
ignore = ["D203","D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D103", "D205", "D209", "PLR0913", "PLR0917", "RUF002", "ANN401"]
"src/orthosteric/pocket/_pocket_geometry.py" = ["RUF002", "ANN401"]
"src/orthosteric/pocket/_rotamer_state.py" = ["RUF002", "RUF003", "ANN401"]
"src/orthosteric/pocket/_solvent_accessibility.py" = ["ANN401"]
"src/orthosteric/pocket/_residue_mapping.py" = ["RUF001", "RUF002"]
"src/orthosteric/data/harmonization/*.py" = [
    "S110",  # try/except/pass in RDKit metal disconnection
    "N812",  # rdkit version import alias
]
"src/orthosteric/data/sources/**/*.py" = [
    "S310", "S607", "BLE001", "ARG002",
]
"src/orthosteric/data/sources/*.py" = [
    "ARG002",  # **kwargs kept for interface contract
    "S112",    # try/except/continue in network retry loops
    "BLE001",  # broad exception in network loops
]
"src/orthosteric/data/*.py" = [
    "D101", "D102", "D103", "D104", "D107",
    "ARG001",
    "PLR2004", "PLR0912",
    "S310", "S607",
    "RUF001", "RUF002", "RUF003",
    "D205",
    "ANN401",
    "N818",  # GovernanceException name is a deliberate design choice
]
"scripts/refresh_corpus.py" = ["D103", "S607"]
"tests/data/sources/*.py" = ["PLC0415"]  # monkeypatch requires local import
"src/orthosteric/features/_contact_map.py" = [
    "ANN401",    # BioPython atoms typed as Any (no stubs)
    "PLR0913",   # Many-arg private functions
    "PLR0917",
    "ARG001",
    "RUF003",
    "E702",
]
"src/orthosteric/features/_structural_graph.py" = [
    "ANN401",
    "PLR0913",
    "PLR0917",
    "ARG001",
    "RUF003",
    "E702",
]
"src/orthosteric/eval/_productive_binding.py" = ["PLR0912", "PLR0913", "PLR0917"]
"src/orthosteric/eval/_uncertainty.py" = ["PLR0913", "PLR0917"]
"src/orthosteric/features/_pipeline.py" = [
    "ANN401",    # BioPython bio_structure typed as Any
    "PLR0913",   # 8-arg compute_features by design
    "PLR0917",
]
"src/orthosteric/features/_interaction_fingerprint.py" = [
    "ANN401",    # BioPython atoms typed as Any (no stubs)
    "PLR0913",   # Many-arg private detection functions
    "PLR0917",   # Same
    "ARG001",    # isoform parameter reserved for future use
    "RUF003",    # EN DASH in structural formula comments
    "E702",      # Inline conditionals in geometry helpers
    "BLE001",    # Broad except in RDKit aromatic detection (external)
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orthosteric.eval._baselines"
warn_unreachable = false

[[tool.mypy.overrides]]
module = "orthosteric.eval._splitting"
warn_unreachable = false

[[tool.mypy.overrides]]
# BioPython 1.87 ships no PEP 561 stubs; suppress per-module rather than sprinkling type:ignore
module = ["Bio.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Pocket modules using BioPython: suppress untyped-call and no-any-generics
module = [
    "orthosteric.pocket._pocket_geometry",
    "orthosteric.pocket._rotamer_state",
    "orthosteric.pocket._solvent_accessibility",
]
disallow_untyped_calls = false
ignore_errors = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Features module using BioPython + RDKit (no stubs): suppress untyped errors
module = ["orthosteric.features._interaction_fingerprint"]
disallow_untyped_calls = false
warn_unused_ignores = false
warn_unreachable = false

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::RuntimeWarning:Bio.PDB.vectors",
]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/orthosteric"]
branch = true

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = "tests.data.sources.structural.*"
disable_error_code = ["comparison-overlap", "unused-ignore"]

[[tool.mypy.overrides]]
module = "orthosteric.data.harmonization._scaffold"
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = "tests.features.*"
disallow_untyped_calls = false
warn_return_any = false
warn_unused_ignores = false
ignore_errors = false
disallow_any_generics = false
